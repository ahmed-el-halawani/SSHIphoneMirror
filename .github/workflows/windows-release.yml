name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the pushed commit and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Choose the next patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.cjs prepare

      - name: Install locked dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci --ignore-scripts

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: npm test

      - name: Install verified Electron runtime
        if: steps.version.outputs.skip != 'true'
        run: node node_modules/electron/install.js

      - name: Build the Windows installer
        if: steps.version.outputs.skip != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never

      - name: Publish release with installer EXE
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/github-release.cjs publish
